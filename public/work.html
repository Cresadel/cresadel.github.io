<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex"
    >

    <meta
        http-equiv="refresh"
        content="0; url=./#/work"
    >

    <title>Redirecting to Work | Cresadel M. Dela Cruz</title>

    <link
        rel="icon"
        type="image/svg+xml"
        href="./favicon.svg"
    >

    <style>
        :root {
            color-scheme: light dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f6f3eb;
            color: #1b1b1f;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            text-align: center;
        }

        p {
            margin: 0;
            line-height: 1.6;
        }

        a {
            color: #3157a4;
            font-weight: 600;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #0c0c11;
                color: #f1f1f3;
            }

            a {
                color: #9db8ff;
            }
        }
    </style>

</head>

<body>

    <main>
        <p>Redirecting to <a href="./#/work">Work</a>&hellip;</p>
    </main>

    <script>
        window.location.replace("./#/work" + window.location.hash);
    </script>

</body>

</html>
